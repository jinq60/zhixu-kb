# =====================================================================
# 知序智能知识库 - Docker 全栈编排
#
# 一键启动（含全部中间件）:
#   docker compose up -d --build
#
# 敏感配置（AI_API_KEY / JWT_SECRET / ADMIN_BOOTSTRAP_KEY）:
#   在仓库根目录创建 .env 文件（参考 .env.example / .env.secrets.example），
#   compose 会自动读取，如:
#     AI_API_KEY=sk-xxx
#     JWT_SECRET=please-change-me-0123456789
# =====================================================================

name: zhixu-kb

x-common-env: &common-env
  TZ: Asia/Shanghai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------- 中间件 ----------------
  mysql:
    image: mysql:8.0
    container_name: zhixu-mysql
    restart: unless-stopped
    environment:
      <<: *common-env
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: zhixu_kb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --ngram_token_size=2
    ports:
      # 仅本机可达，避免公网直连数据库
      - "127.0.0.1:3306:3306"
    logging: *default-logging
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: zhixu-redis
    restart: unless-stopped
    ports:
      # 本机如有原生 Redis 占用 6379，可改用 6380
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:4.4-community
    container_name: zhixu-neo4j
    restart: unless-stopped
    environment:
      <<: *common-env
      # 注意：Neo4j 官方镜像禁止使用默认密码 'neo4j'，必须显式指定其他值
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-zhixu123456}
    ports:
      # 管理界面如需公网访问，请改为 0.0.0.0:7474 并自行加鉴权
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-zhixu123456} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ---------------- Milvus 向量数据库（RAG 语义检索） ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: zhixu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    logging: *default-logging
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: zhixu-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_VOLUMES: /minio_data
    command: minio server /minio_data
    volumes:
      - minio-data:/minio_data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: zhixu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      # 仅本机可达（Java SDK 连接 19530）
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------- 应用 ----------------
  ocr-service:
    build: ./ocr-service
    image: zhixu-ocr-service:latest
    container_name: zhixu-ocr
    restart: unless-stopped
    # 资源上限：OCR（Paddle 推理）内存占用大，限制其与后端抢内存触发 OOM Killer
    mem_limit: 3g
    cpus: 2.0
    environment:
      <<: *common-env
      OCR_PORT: 5001
      OCR_DEBUG: "false"
      OCR_CORS: "true"
      USE_DEEPSEEK_OCR: "false"        # 容器内默认 PaddleOCR（CPU）
      OCR_ENABLE_PADDLE: "true"
      OCR_ENABLE_DEEPSEEK: "false"
      OCR_DEFAULT_ENGINE: paddle
      OCR_USE_GPU: "false"
      OCR_USE_ANGLE: "false"
      # WSL2/Docker 虚拟化下 AMD CPU 的 SIGILL 规避：
      # 限制 OpenBLAS 与 oneDNN 的指令集上限为 AVX2（Ryzen 3700X 无 AVX512）
      OPENBLAS_CORETYPE: Haswell
      DNNL_MAX_CPU_ISA: AVX2
    ports:
      # 仅本机可达：OCR 服务无鉴权，不得暴露到公网
      - "127.0.0.1:5001:5001"
    volumes:
      - ocr-tmp:/app/tmp
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5001/ocr/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  pdf-service:
    # 锁定镜像版本，避免 latest 标签引入破坏性更新；升级前请验证兼容性
    image: ghcr.io/xberg-io/xberg:1.0.14
    container_name: zhixu-pdf
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.0
    pull_policy: if_not_present
    command: ["serve", "-H", "0.0.0.0", "-p", "5002"]
    environment:
      <<: *common-env
      # 最大允许 50MB 的请求体（扫描版 PDF 膨胀 5-10x，1.5g 内存下 200MB 极易 OOM；与前后端 50m 上传上限对齐）
      XBERG_MAX_REQUEST_BODY_BYTES: "52428800"
      XBERG_MAX_MULTIPART_FIELD_BYTES: "52428800"
    ports:
      # 仅本机可达
      - "127.0.0.1:5002:5002"
    volumes:
      - xberg-cache:/app/.cache/xberg
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  backend:
    build: ./backend
    image: zhixu-backend:latest
    container_name: zhixu-backend
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    # 安全加固：默认不挂载 docker.sock，运行状态页将显示降级提示；
    # 如需容器状态采集，请改为 socket-proxy 白名单方案（见下方注释）
    environment:
      <<: *common-env
      DB_URL: jdbc:mysql://mysql:3306/zhixu_kb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zhixu123456}
      NEO4J_ENABLED: "true"
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_ENABLED: "true"
      # 向量维度：与 embedding 模型一致（bge-m3/text-embedding-v3=1024，text-embedding-3-small=1536）
      MILVUS_DIMENSION: ${MILVUS_DIMENSION:-1536}
      OCR_SERVICE_URL: http://ocr-service:5001
      PDF_PARSE_SERVICE_URL: http://pdf-service:5002
      AI_ENGINE_TYPE: ${AI_ENGINE_TYPE:-api}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_ENDPOINTS: ${AI_ENDPOINTS:-}
      DEEPSEEK_API_KEY: ${AI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CRYPTO_AES_KEY: ${CRYPTO_AES_KEY:-}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OAUTH_FRONTEND_CALLBACK: ${OAUTH_FRONTEND_CALLBACK:-http://localhost:5173/oauth-callback}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/github/callback}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/google/callback}
      OAUTH_QQ_ENABLED: ${OAUTH_QQ_ENABLED:-false}
      OAUTH_QQ_CLIENT_ID: ${OAUTH_QQ_CLIENT_ID:-}
      OAUTH_QQ_CLIENT_SECRET: ${OAUTH_QQ_CLIENT_SECRET:-}
      OAUTH_QQ_REDIRECT_URI: ${OAUTH_QQ_REDIRECT_URI:-http://localhost:8080/api/auth/oauth/qq/callback}
      FILE_UPLOAD_PATH: /app/uploads/images/
      APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5175}
      # SSRF 防护：本机/容器若使用 Clash/Mihomo 等 fake-ip 代理，AI 端点域名会解析到
      # 198.18.0.0/15 或 IPv6 ULA 段，默认会被 SafeUrlValidator 拒绝。
      # Docker 环境默认放行（与本地启动脚本一致），生产环境请显式设置 SSRF_ALLOW_FAKE_IP=false。
      JAVA_TOOL_OPTIONS: "-Dssrf.allow-fake-ip-ranges=${SSRF_ALLOW_FAKE_IP:-true}"
      # JSON 日志输出目录（logback-spring.xml 引用，供 Filebeat 采集）
      LOG_FILE_PATH: /app/logs
    ports:
      # 仅 host 发布收敛到回环；frontend 经 compose 内网 proxy_pass backend:8080 不受影响，切勿改为 localhost
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      # 如需开启容器状态页，推荐 socket-proxy 白名单（仅 GET /containers/json）：
      # 1) 新增服务 docker-socket-proxy: image: tecnativa/docker-socket-proxy ... environment: CONTAINERS=1 INFO=1 ...
      # 2) backend 挂载改为 - /var/run/docker.sock:/var/run/docker.sock:ro 的代理地址
      # 当前默认不挂载，SystemStatusService 会降级为仅主机探活
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      pdf-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: zhixu-frontend:latest
    container_name: zhixu-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      # 官网下载中心：把桌面版安装包放入宿主机 ./downloads 即可提供下载
      - ./downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  admin-frontend:
    build: ./admin-frontend
    image: zhixu-admin-frontend:latest
    container_name: zhixu-admin-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  # ---------------- ELK 日志栈（profile: logs，按需启动） ----------------
  # 启动：docker compose --profile logs up -d
  # 注意（WSL2/Docker Desktop）：Elasticsearch 需要
  #   wsl -d docker-desktop -u root sysctl -w vm.max_map_count=262144
  # Kibana 日志中心：http://localhost:5601 （数据视图模式 zhixu-backend-*）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: zhixu-elasticsearch
    restart: unless-stopped
    profiles: ["logs"]
    environment:
      <<: *common-env
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      # 仅本机可达
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: zhixu-kibana
    restart: unless-stopped
    profiles: ["logs"]
    environment:
      <<: *common-env
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # 本地单机：关闭安全与遥测（生产必须开启 TLS + 鉴权）
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: zhixu-kb-local-kibana-key-0123456789
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    logging: *default-logging
    mem_limit: 800m
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: zhixu-filebeat
    restart: unless-stopped
    profiles: ["logs"]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      <<: *common-env
    volumes:
      - ./docker/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - backend-logs:/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    logging: *default-logging
    mem_limit: 300m
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---------------- Portainer 容器面板（profile: logs） ----------------
  # 浏览器查看任意容器日志/统计/终端/启停：http://localhost:9000
  # 首次访问需创建本地管理员账号（几分钟不设置会自动锁定，重启容器可重试）
  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: zhixu-portainer
    restart: unless-stopped
    profiles: ["logs"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - portainer-data:/data
      # 只读挂载：Portainer 仅做状态/日志/终端，不需要改动 Docker 实体的写权限场景
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    mem_limit: 256m

volumes:
  mysql-data:
  redis-data:
  neo4j-data:
  etcd-data:
  minio-data:
  milvus-data:
  ocr-tmp:
  xberg-cache:
  backend-uploads:
  backend-logs:
  es-data:
  filebeat-data:
  portainer-data:
